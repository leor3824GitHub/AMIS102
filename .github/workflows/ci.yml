name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g., 10.0.0-rc.1)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Exclude MAUI from the Linux solution build
        # The MAUI heads (windows/ios TFMs) can't build on Linux and no MAUI workload is
        # installed here; the MAUI app is validated separately in the build-maui job.
        # Remove it from this ephemeral CI checkout so restore/build of the rest of the
        # solution stays green (auto-includes any future backend project — no hand-kept list).
        run: dotnet sln src/AMIS.Framework.slnx remove src/Host/AMIS.Maui/AMIS.Maui.csproj

      - name: Restore dependencies
        run: dotnet restore src/AMIS.Framework.slnx

      - name: Build
        run: dotnet build src/AMIS.Framework.slnx -c Release --no-restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            src/**/bin/Release
            src/**/obj/Release
          retention-days: 1

  build-maui:
    name: Build MAUI (Windows head)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Build MAUI (Windows head)
        # Build only the Windows TFM (ios needs macOS; android is validated by devs locally).
        # This is the gate that catches MAUI compile errors and analyzer failures — e.g. the
        # MVVMTK0045 class of issues — which the Linux solution build never sees.
        run: dotnet build src/Host/AMIS.Maui/AMIS.Maui.csproj -c Release -f net10.0-windows10.0.19041.0

  security-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Exclude MAUI from the Linux restore
        run: dotnet sln src/AMIS.Framework.slnx remove src/Host/AMIS.Maui/AMIS.Maui.csproj

      - name: Audit NuGet dependencies
        # `dotnet list package --vulnerable` exits 0 even when it finds something, so the
        # findings have to be grepped and turned into a failure explicitly.
        # This gate exists because two high-severity transitive CVEs sat in the tree unnoticed:
        # Microsoft.OpenApi 2.0.0 (GHSA-v5pm-xwqc-g5wc) and
        # System.Security.Cryptography.Xml 10.0.7 (CVE-2026-50648 + 4 more).
        # Both were only visible as ordinary build warnings nobody read.
        run: |
          dotnet restore src/AMIS.Framework.slnx
          dotnet list src/AMIS.Framework.slnx package --vulnerable --include-transitive \
            > audit.txt 2>&1 || true
          cat audit.txt
          if grep -qE '\b(High|Critical)\b' audit.txt; then
            echo "::error::High or critical severity vulnerable package(s) detected — see the log above."
            exit 1
          fi
          if grep -q 'has the following vulnerable packages' audit.txt; then
            echo "::warning::Low/moderate severity vulnerable package(s) detected."
          fi
          echo "No high or critical severity vulnerabilities."

  discover-tests:
    name: Discover test projects
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the test matrix from the filesystem
        id: find
        # Derive the matrix from what is actually on disk instead of a hand-kept list.
        # A hand-kept list is exactly how this drifted before: 7 of the 12 test projects
        # (~283 facts, incl. all of AssetRegister and ProcurementAcquisition) existed for
        # months without ever running in CI, because adding a project didn't update this file.
        # -mindepth/-maxdepth 2 matches src/Tests/<Project>/<Project>.csproj and skips bin/obj.
        run: |
          MATRIX=$(find src/Tests -mindepth 2 -maxdepth 2 -name '*.csproj' | sort | jq -R -s -c '
            split("\n") | map(select(length > 0)) |
            map({ name: (split("/") | last | rtrimstr(".csproj")), path: . })')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Discovered $(echo "$MATRIX" | jq 'length') test project(s):"
          echo "$MATRIX" | jq -r '.[].path'

  test:
    name: Test - ${{ matrix.test-project.name }}
    runs-on: ubuntu-latest
    needs: [build, discover-tests]

    strategy:
      fail-fast: false
      matrix:
        test-project: ${{ fromJson(needs.discover-tests.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: src

      - name: Run ${{ matrix.test-project.name }}
        run: |
          dotnet test ${{ matrix.test-project.path }} -c Release --no-build --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory "TestResults/${{ matrix.test-project.name }}"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.test-project.name }}
          path: TestResults/${{ matrix.test-project.name }}/**/coverage.cobertura.xml
          retention-days: 1
          if-no-files-found: warn

  coverage-report:
    name: Coverage report
    runs-on: ubuntu-latest
    needs: test
    # Report only — deliberately NOT a gate. Gating on a threshold nobody has measured
    # just blocks PRs. Establish the trend first, then decide a floor worth enforcing.
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-raw

      - name: Merge into one report
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"coverage-raw/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Html;MarkdownSummaryGithub;TextSummary"

      - name: Publish summary
        run: cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report
          retention-days: 7

  publish-dev-containers:
    name: Publish Dev Containers
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish API container image
        run: |
          dotnet publish src/Host/AMIS.Api/AMIS.Api.csproj \
            -c Release -r linux-x64 \
            -p:PublishProfile=DefaultContainer \
            -p:ContainerRepository=ghcr.io/${{ github.repository_owner }}/AMIS-playground-api \
            -p:ContainerImageTags='"dev-${{ github.sha }};dev-latest"'

      - name: Publish Blazor container image
        run: |
          dotnet publish src/Host/AMIS.Blazor/AMIS.Blazor.csproj \
            -c Release -r linux-x64 \
            -p:PublishProfile=DefaultContainer \
            -p:ContainerRepository=ghcr.io/${{ github.repository_owner }}/AMIS-playground-blazor \
            -p:ContainerImageTags='"dev-${{ github.sha }};dev-latest"'

      - name: Push containers to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/AMIS-playground-api:dev-${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/AMIS-playground-api:dev-latest
          docker push ghcr.io/${{ github.repository_owner }}/AMIS-playground-blazor:dev-${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/AMIS-playground-blazor:dev-latest

  publish-release:
    name: Publish Release (NuGet + Containers)
    runs-on: ubuntu-latest
    needs: test
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch') ||
      startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            echo "No version specified and not a tag push"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Exclude MAUI from the Linux solution build
        # Same reason as the build job: the MAUI app is a Windows/mobile client validated in
        # build-maui, and is not packed or containerized here.
        run: dotnet sln src/AMIS.Framework.slnx remove src/Host/AMIS.Maui/AMIS.Maui.csproj

      - name: Restore and Build with version
        run: |
          dotnet restore src/AMIS.Framework.slnx
          dotnet build src/AMIS.Framework.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Pack BuildingBlocks
        run: |
          dotnet pack src/BuildingBlocks/Core/Core.csproj -c Release --no-build -o ./nupkgs -p:PackageVersion=${{ steps.version.outputs.version }}
          dotnet pack src/BuildingBlocks/Shared/Shared.csproj -c Release --no-build -o ./nupkgs -p:PackageVersion=${{ steps.version.outputs.version }}
          dotnet pack src/BuildingBlocks/Persistence/Persistence.csproj -c Release --no-build -o ./nupkgs -p:PackageVersion=${{ steps.version.outputs.version }}
          dotnet pack src/BuildingBlocks/Caching/Caching.csproj -c Release --no-build -o ./nupkgs -p:PackageVersion=${{ steps.version.outputs.version }}
          dotnet pack src/BuildingBlocks/Mailing/Mailing.csproj -c Release --no-build -o ./nupkgs -p:PackageVersion=${{ steps.version.outputs.version }}
          dotnet pack src/BuildingBlocks/Jobs/Jobs.csproj -c Release --no-build -o ./nupkgs -p:PackageVersion=${{ steps.version.outputs.version }}
          dotnet pack src/BuildingBlocks/Storage/Storage.csproj -c Release --no-build -o ./nupkgs -p:PackageVersion=${{ steps.version.outputs.version }}
          dotnet pack src/BuildingBlocks/Eventing/Eventing.csproj -c Release --no-build -o ./nupkgs -p:PackageVersion=${{ steps.version.outputs.version }}
          dotnet pack src/BuildingBlocks/Web/Web.csproj -c Release --no-build -o ./nupkgs -p:PackageVersion=${{ steps.version.outputs.version }}
          dotnet pack src/BuildingBlocks/Blazor.UI/Blazor.UI.csproj -c Release --no-build -o ./nupkgs -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Pack Modules
        run: |
          dotnet pack src/Modules/Auditing/Modules.Auditing.Contracts/Modules.Auditing.Contracts.csproj -c Release --no-build -o ./nupkgs -p:PackageVersion=${{ steps.version.outputs.version }}
          dotnet pack src/Modules/Auditing/Modules.Auditing/Modules.Auditing.csproj -c Release --no-build -o ./nupkgs -p:PackageVersion=${{ steps.version.outputs.version }}
          dotnet pack src/Modules/Identity/Modules.Identity.Contracts/Modules.Identity.Contracts.csproj -c Release --no-build -o ./nupkgs -p:PackageVersion=${{ steps.version.outputs.version }}
          dotnet pack src/Modules/Identity/Modules.Identity/Modules.Identity.csproj -c Release --no-build -o ./nupkgs -p:PackageVersion=${{ steps.version.outputs.version }}
          dotnet pack src/Modules/Multitenancy/Modules.Multitenancy.Contracts/Modules.Multitenancy.Contracts.csproj -c Release --no-build -o ./nupkgs -p:PackageVersion=${{ steps.version.outputs.version }}
          dotnet pack src/Modules/Multitenancy/Modules.Multitenancy/Modules.Multitenancy.csproj -c Release --no-build -o ./nupkgs -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Pack CLI Tool
        run: dotnet pack src/Tools/CLI/AMIS.CLI.csproj -c Release --no-build -o ./nupkgs -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Push to NuGet.org
        run: dotnet nuget push "./nupkgs/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API container
        run: |
          dotnet publish src/Host/AMIS.Api/AMIS.Api.csproj \
            -c Release -r linux-x64 \
            -p:PublishProfile=DefaultContainer \
            -p:ContainerRepository=ghcr.io/${{ github.repository_owner }}/AMIS-playground-api \
            -p:ContainerImageTags='"${{ steps.version.outputs.version }};latest"'
          docker push ghcr.io/${{ github.repository_owner }}/AMIS-playground-api:${{ steps.version.outputs.version }}
          docker push ghcr.io/${{ github.repository_owner }}/AMIS-playground-api:latest

      - name: Build and push Blazor container
        run: |
          dotnet publish src/Host/AMIS.Blazor/AMIS.Blazor.csproj \
            -c Release -r linux-x64 \
            -p:PublishProfile=DefaultContainer \
            -p:ContainerRepository=ghcr.io/${{ github.repository_owner }}/AMIS-playground-blazor \
            -p:ContainerImageTags='"${{ steps.version.outputs.version }};latest"'
          docker push ghcr.io/${{ github.repository_owner }}/AMIS-playground-blazor:${{ steps.version.outputs.version }}
          docker push ghcr.io/${{ github.repository_owner }}/AMIS-playground-blazor:latest

